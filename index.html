<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download Anturno</title>
    <meta name="description" content="Install Anturno on macOS or Linux." />
    <link rel="icon" href="icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #0a0a0a;
        --muted: #737373;
        --line: #e5e5e5;
        --field: #f5f5f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --ink: #fafafa;
          --muted: #8a8a8a;
          --line: #262626;
          --field: #161616;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(560px, calc(100vw - 48px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .command {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 6px 6px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--field);
      }
      code {
        flex: 1;
        overflow-x: auto;
        scrollbar-width: none;
        white-space: nowrap;
        text-align: left;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      button {
        flex: none;
        height: 32px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: var(--bg);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .meta {
        margin: -12px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px 16px;
        font-size: 13px;
      }
      a {
        color: var(--muted);
        text-decoration: none;
      }
      a:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="" />
      <h1>Anturno</h1>
      <div class="command">
        <code id="command">curl -fsSL https://download.anturno.cloud/install.sh | sh</code>
        <button type="button" id="copy">Copy</button>
      </div>
      <p class="meta"><span id="version"></span>macOS on Apple silicon · Linux x64</p>
      <nav aria-label="Other downloads">
        <a href="https://github.com/anturno/releases/releases/latest/download/Anturno-linux-amd64.deb">.deb</a>
        <a href="https://github.com/anturno/releases/releases/latest/download/Anturno-linux-x86_64.AppImage">AppImage</a>
        <a href="https://github.com/anturno/releases/releases/latest/download/Anturno-linux-x64.tar.gz">.tar.gz</a>
        <a href="https://github.com/anturno/releases/releases">All releases</a>
      </nav>
    </main>
    <script>
      const copy = document.getElementById("copy");
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(document.getElementById("command").textContent);
          copy.textContent = "Copied";
        } catch {
          getSelection().selectAllChildren(document.getElementById("command"));
          copy.textContent = "Selected";
        }
        setTimeout(() => (copy.textContent = "Copy"), 1600);
      });
      fetch("latest.json", { cache: "no-store" })
        .then((res) => (res.ok ? res.json() : null))
        .then((release) => {
          if (release?.version) document.getElementById("version").textContent = `${release.version} · `;
        })
        .catch(() => {});
    </script>
  </body>
</html>
