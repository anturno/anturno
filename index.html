<!-- Drawn after the web app's sign-in (apps/web/src/components/remote/sign-in-shell.tsx): its dark page, dawn field, tile and column. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download Anturno</title>
    <meta name="description" content="Install Anturno on macOS, Linux or Windows." />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="icon.png" />
    <style>
      /* The app's dark tokens (packages/system/src/styles/tokens.css): the sign-in is always dark. */
      :root {
        color-scheme: dark;
        --background: #111111;
        --foreground: #fcfcfc;
        --muted: #1a1a1a;
        --muted-foreground: #999999;
        --border: #222222;
        --ring: #3386d6;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--background);
      }
      body {
        margin: 0;
        color: var(--foreground);
        font: 14px/1.5 "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* The sign-in's rows: a top strip, equal space around the group, a slightly taller band at the foot. */
      main {
        position: relative;
        isolation: isolate;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 2.5rem 1fr auto auto 1fr 4rem;
        justify-items: center;
        padding: 0 24px;
        text-align: center;
      }
      .field {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }
      .field canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .head {
        grid-row: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .tile {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        color: var(--foreground);
      }
      /* The mark alone, no square behind it, as the app's loading screen and sign-in show it. */
      .tile svg {
        width: 40px;
        height: 40px;
      }
      h1 {
        margin: 28px 0 0;
        font-family: "Geist", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .step {
        grid-row: 4;
        align-self: start;
        width: 100%;
        max-width: 560px;
        padding-top: 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      /* The command, in the sign-in's code field. */
      .command {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 6px 6px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: color-mix(in srgb, var(--muted) 40%, transparent);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      code {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
        white-space: nowrap;
        text-align: left;
        font: 12px/1.6 "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        user-select: all;
      }
      code::-webkit-scrollbar {
        display: none;
      }
      code .prompt {
        color: var(--muted-foreground);
        user-select: none;
      }
      button {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        min-width: 76px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--foreground);
        color: var(--background);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 160ms ease,
          scale 160ms var(--ease-out);
      }
      button:hover {
        background: color-mix(in srgb, var(--foreground) 90%, transparent);
      }
      button:active {
        scale: 0.97;
      }
      .command button svg {
        width: 14px;
        height: 14px;
      }
      button span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      button:focus-visible {
        outline: none;
        border-color: color-mix(in srgb, var(--background) 70%, transparent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--background) 35%, transparent) inset;
      }
      .fine {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 4px 6px;
      }
      a {
        border-radius: 4px;
        color: var(--muted-foreground);
        text-decoration: none;
        outline: none;
        transition: color 160ms ease;
      }
      a:hover {
        color: var(--foreground);
      }
      a:focus-visible {
        box-shadow: 0 0 0 2px var(--ring);
      }

      /* The group, then the step, rise in turn as the page shows (sign-in-motion.module.css). */
      .rise {
        animation: rise 520ms var(--ease-out) backwards;
        animation-delay: calc(var(--order) * 70ms + 140ms);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
          filter: blur(4px);
        }
      }
      .swap {
        animation: swap 180ms ease-in-out backwards;
      }
      @keyframes swap {
        from {
          opacity: 0;
          transform: translateY(4px);
          filter: blur(2px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rise,
        .swap {
          animation: none;
        }
        button {
          transition: none;
        }
      }
    </style>
  </head>

        <h1>Download Anturno</h1>
      </div>
      <div class="step rise" style="--order: 1">
        <div class="command">
          <code><span class="prompt" id="prompt">$ </span><span id="command">curl -fsSL https://download.anturno.cloud/install.sh | sh</span></code>
          <button type="button" id="copy" aria-live="polite"><span>Copy</span></button>

          <p style="margin: 0"><span id="version"></span>macOS on Apple silicon · Linux x64 · Windows x64</p>

    </main>
    <script>
      const copy = document.getElementById("copy");
      const command = document.getElementById("command");
      // Windows installs from PowerShell (install.ps1).
      if (/Windows/.test(navigator.userAgent)) {
        document.getElementById("prompt").textContent = "> ";
        command.textContent = "irm https://download.anturno.cloud/install.ps1 | iex";
      }
      const CHECK =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
      let reset = 0;
      const label = (html) => {
        copy.innerHTML = `<span class="swap">${html}</span>`;
      };
      copy.addEventListener("click", async () => {
        clearTimeout(reset);
        try {
          await navigator.clipboard.writeText(command.textContent);
          label(`${CHECK}Copied`);
        } catch {
          getSelection().selectAllChildren(command);
          label("Selected");
        }
        reset = setTimeout(() => label("Copy"), 1600);
      });

      fetch("latest.json", { cache: "no-store" })
        .then((res) => (res.ok ? res.json() : null))
        .then((release) => {
          if (release?.version) document.getElementById("version").textContent = `${release.version} · `;
        })
        .catch(() => {});

      /*
       * The sign-in's backdrop (apps/web/src/lib/sign-in-field.ts): one low glow at the window's foot,
       * in the entry screens' palette (PALETTE: "gradient", amber through magenta to deep indigo, or
       * "dawn", the brand's dawn colours, to go back), diffusing along a slow flow and printed through an
       * 8×8 Bayer dither, one canvas pixel to a 2px cell. Without WebGL 2 the page is whole without it.
       */
      (() => {
        const canvas = document.getElementById("field");
        const gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false, powerPreference: "low-power" });
        if (!gl) return;
        const PALETTE = "gradient";
        const FIELD = { heart: "#F2C4B5", left: "#BCD7EA", right: "#F6D2A8", edge: "#2B3140" };
        const GRADIENT = ["#1B1858", "#27227A", "#5D2DA2", "#9C319E", "#C53A87", "#E24175", "#F25264", "#FA6D4E", "#FB8F4A", "#FFB54A"];
        const CELL = 2;
        const FADE_IN = 1.4;
        const SETTLED = 6;
        const VERTEX = `#version 300 es
in vec2 corner;
void main() { gl_Position = vec4(corner, 0.0, 1.0); }`;
        const FRAGMENT = `#version 300 es
precision highp float;
uniform vec2 size;
uniform float time;
uniform float shown;
uniform vec3 heart;
uniform vec3 left;
uniform vec3 right;
uniform vec3 edge;
uniform float gradient;
uniform vec3 ramp[10];
out vec4 colour;
vec3 paint(float t) {
  t = clamp(t, 0.0, 1.0) * 9.0;
  int i = int(min(floor(t), 8.0));
  return mix(ramp[i], ramp[i + 1], smoothstep(0.0, 1.0, t - float(i)));
}
float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 p) {
  vec3 i = floor(p); vec3 f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float clouds(vec3 p) { return 0.5 * noise(p) + 0.3 * noise(p * 2.03) + 0.2 * noise(p * 4.1); }
float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
vec3 hue(vec3 c) { return c / max(max(c.r, c.g), max(c.b, 0.001)); }
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * size) / size.y;
  float half_width = 0.5 * size.x / size.y;
  vec3 q = vec3(uv * 1.1, time * 0.02);
  vec2 w = uv + (vec2(clouds(q), clouds(q + vec3(5.2, 1.3, 2.7))) - 0.5) * 0.2;
  vec2 at = vec2(sin(time * 0.025) * 0.08 * half_width, -0.62);
  vec2 p = (w - at) / vec2(max(half_width * 0.95, 0.45), 0.4);
  float glow = exp(-dot(p, p) * 1.5);
  glow *= mix(0.8, 1.1, clouds(vec3(w * 2.2, time * 0.03)));
  glow *= 0.94 + 0.06 * sin(time * 0.3);
  float side = clamp(w.x / max(half_width, 0.3), -1.0, 1.0);
  vec3 tint = mix(hue(heart), hue(side < 0.0 ? left : right), smoothstep(0.2, 1.0, abs(side)) * 0.6);
  tint = mix(hue(edge), tint, smoothstep(0.08, 0.5, glow));
  if (gradient > 0.5) tint = hue(paint(0.15 + glow * 0.9 + (clouds(vec3(w * 3.0, time * 0.05)) - 0.5) * 0.2));
  float bright = gradient > 0.5 ? (1.0 - exp(-glow * 1.8)) * 1.05 * shown : (1.0 - exp(-glow * 1.4)) * 0.7 * shown;
  bright *= smoothstep(-0.1, -0.34, w.y);
  const float LEVELS = 5.0;
  float printed = clamp(floor(bright * LEVELS + bayer8(gl_FragCoord.xy)) / LEVELS, 0.0, 1.0);
  colour = vec4(tint * printed, 1.0) * step(0.001, printed);
}`;
        const compile = (type, text) => {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, text);
          gl.compileShader(shader);
          return gl.getShaderParameter(shader, gl.COMPILE_STATUS) ? shader : null;
        };
        const vertex = compile(gl.VERTEX_SHADER, VERTEX);
        const fragment = compile(gl.FRAGMENT_SHADER, FRAGMENT);
        if (!vertex || !fragment) return;
        const program = gl.createProgram();
        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return;
        // biome-ignore lint/correctness/useHookAtTopLevel: WebGL's useProgram, not a React hook.
        gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const corner = gl.getAttribLocation(program, "corner");
        gl.enableVertexAttribArray(corner);
        gl.vertexAttribPointer(corner, 2, gl.FLOAT, false, 0, 0);
        const at = (name) => gl.getUniformLocation(program, name);
        const rgb = (hex) => [1, 3, 5].map((i) => Number.parseInt(hex.slice(i, i + 2), 16) / 255);
        for (const [name, hex] of Object.entries(FIELD)) gl.uniform3fv(at(name), rgb(hex));
        gl.uniform3fv(at("ramp"), GRADIENT.flatMap(rgb));
        gl.uniform1f(at("gradient"), PALETTE === "gradient" ? 1 : 0);
        const size = at("size");
        const time = at("time");
        const shown = at("shown");

        const fit = () => {
          const width = Math.max(1, Math.round(canvas.clientWidth / CELL));
          const height = Math.max(1, Math.round(canvas.clientHeight / CELL));
          if (canvas.width === width && canvas.height === height) return;
          canvas.width = width;
          canvas.height = height;
          gl.viewport(0, 0, width, height);
        };
        const draw = (seconds) => {
          gl.uniform2f(size, canvas.width, canvas.height);
          gl.uniform1f(time, seconds);
          gl.uniform1f(shown, Math.min(1, seconds / FADE_IN) ** 2);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        };

        const still = matchMedia("(prefers-reduced-motion: reduce)");
        const began = performance.now();
        let frame = 0;
        const tick = (now) => {
          draw((now - began) / 1000);
          frame = requestAnimationFrame(tick);
        };
        const start = () => {
          cancelAnimationFrame(frame);
          if (still.matches) draw(SETTLED);
          else frame = requestAnimationFrame(tick);
        };
        new ResizeObserver(() => {
          fit();
          if (still.matches) draw(SETTLED);
        }).observe(canvas);
        fit();
        start();
        still.addEventListener("change", start);
      })();
    </script>
  </body>
